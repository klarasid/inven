# Publishes a GitHub release with the installable plugin zip whenever a v* tag is pushed
# (prepare one with tools/release.sh <version>). Tags with a suffix such as v2.1.0-rc.1 become
# pre-releases, which the in-app update check ignores.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build package
        run: tools/release.sh package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --title "$TAG" --generate-notes --verify-tag $prerelease
